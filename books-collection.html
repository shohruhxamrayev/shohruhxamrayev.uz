<main class="wrap books-page">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="books.html">Books</a><span>/</span><span aria-current="page">Collection</span></nav>

  <h1 class="col-heading">The collection</h1>
  <p class="col-lede">Every book on the shelf. Search the shelf, filter by status, and switch between cover and list views.</p>

  <label class="col-search">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input type="search" id="bookSearch" placeholder="Search by title or author" aria-label="Search by title or author" autocomplete="off">
  </label>

  <div class="col-bar">
    <div class="col-tabs" role="tablist">
      <button class="col-tab active" role="tab" aria-selected="true" data-filter="all">All <span id="countAll"></span></button>
      <button class="col-tab" role="tab" aria-selected="false" data-filter="read">Read <span id="countRead"></span></button>
      <button class="col-tab" role="tab" aria-selected="false" data-filter="reading">Reading <span id="countReading"></span></button>
    </div>
    <div class="col-views">
      <button class="col-view active" data-view="grid" aria-label="Cover view" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
      <button class="col-view" data-view="list" aria-label="List view" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="2.5" cy="4" r="1"/><circle cx="2.5" cy="8" r="1"/><circle cx="2.5" cy="12" r="1"/><rect x="5" y="3.3" width="9" height="1.4" rx=".7"/><rect x="5" y="7.3" width="9" height="1.4" rx=".7"/><rect x="5" y="11.3" width="9" height="1.4" rx=".7"/></svg></button>
    </div>
  </div>

  <div id="collectionGrid" class="col-grid"></div>
  <p class="col-empty" id="collectionEmpty" hidden>No books match that search.</p>
</main>
